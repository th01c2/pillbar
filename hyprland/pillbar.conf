# ~/.config/hypr/pillbar.conf  (source it from hyprland.conf, or paste inline)

exec-once = pillbar

# Keep the pill crisp: no blur, no glass, no shadow from the compositor.
layerrule = blur off, pillbar
layerrule = blur off, pillbar-tooltip
layerrule = ignorealpha 0.0, pillbar-tooltip
layerrule = ignorezero, pillbar-tooltip

# A short slide-in is fine; a static layer rule is also acceptable.
layerrule = animation slide top, pillbar
layerrule = animation slide top, pillbar-tooltip

